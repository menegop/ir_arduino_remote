<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Telecomando IR universale con Arduino Uno, apprendimento RAW e database telecomandi.">
  <title>IR Remote Lab v12</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=12.0.0">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">IR</div>
      <div>IR Remote Lab <span class="version-badge">v12</span></div>
    </div>
    <div class="header-actions">
      <span id="serialStatus" class="status-pill">Arduino non collegato</span>
      <button id="installButton" class="btn hidden">Installa app</button>
      <button id="connectButton" class="btn primary">Collega Arduino</button>
    </div>
  </header>
  <main id="app"></main>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script src="./remotes_db.js?v=12.0.0"></script>
  <script src="./external_db.js?v=12.0.0"></script>
  <script src="./usb_serial.js?v=12.0.0"></script>
  <script src="./app.js?v=12.0.0"></script>
</body>
</html>
